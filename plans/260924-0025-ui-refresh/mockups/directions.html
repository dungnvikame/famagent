<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family AI — 3 hướng giao diện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#f4f2ef;color:#1d1d1f;padding:24px 16px 60px}
.switch{max-width:1240px;margin:0 auto 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.switch h1{font-size:18px;margin-right:auto}
.switch button{border:1px solid #d6d2cc;background:#fff;border-radius:999px;padding:9px 16px;font:600 13px inherit;cursor:pointer}
.switch button[aria-pressed=true]{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.note{max-width:1240px;margin:0 auto 18px;font-size:13px;color:#57534e;line-height:1.55}
.stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
@media(max-width:1000px){.stage{grid-template-columns:1fr}.stage .phone{max-width:390px;margin:0 auto}}
.frame{border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -30px #0004;container-type:inline-size;min-height:760px}
.phone{border:10px solid #111;border-radius:44px}
.label{font:600 11px/1 inherit;letter-spacing:.12em;text-transform:uppercase;color:#78716c;margin:0 0 8px 6px}

/* ---------- shared structure ---------- */
.app{display:flex;flex-direction:column;min-height:760px;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:18px 26px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ctx{display:flex;gap:8px;flex-wrap:wrap;padding:0 26px 12px}
.ctx span{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px}
.thread{flex:1;padding:8px 26px 18px;display:flex;flex-direction:column;gap:16px}
.me{align-self:flex-end;max-width:78%;padding:12px 16px;font-size:14px;line-height:1.5}
.ai{display:flex;gap:12px;align-items:flex-start}
.ai .orb{flex:none;width:34px;height:34px;border-radius:50%}
.ai p{font-size:14.5px;line-height:1.6;max-width:640px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@container (max-width:700px){.cards{grid-template-columns:1fr}.top,.ctx,.thread,.composer{padding-left:16px;padding-right:16px}.hide-sm{display:none}}
.card{display:flex;flex-direction:column;overflow:hidden}
.pic{height:128px;display:grid;place-items:center;position:relative}
.pic svg{width:92px;height:92px}
.badge{position:absolute;top:12px;left:12px;font:700 10.5px/1 inherit;letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.brand{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.name{font-size:16px;font-weight:700;line-height:1.3}
.fit{display:flex;flex-wrap:wrap;gap:6px}
.fit span{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:999px}
.price{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.price b{font-size:21px}
.price small{font-size:12px}
.meta{font-size:11.5px;line-height:1.45}
.why{font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.actions{display:flex;gap:8px;margin-top:auto}
.actions button{flex:1;border-radius:12px;padding:10px 6px;font:700 12.5px inherit;cursor:pointer}
.disclosure{font-size:11.5px;line-height:1.5;margin-left:46px}
.cmpbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 26px 10px;padding:11px 14px;font-size:13px;font-weight:600}
.cmpbar button{border:0;border-radius:10px;padding:8px 14px;font:700 12.5px inherit;cursor:pointer}
.composer{padding:0 26px 22px}
.box{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.box .ph{font-size:14.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px}
.send{display:flex;align-items:center;justify-content:space-between}
.send button{border:0;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer}

/* ---------- A: Warm Editorial ---------- */
.A .app{background:#fbf7f1;color:#2b2320}
.A .logo i{width:30px;height:30px;border-radius:9px;background:#c2562f;color:#fff;display:grid;place-items:center;font-style:normal;font-family:Fraunces,serif}
.A .status{color:#6b5e57}.A .status i{background:#4f9a6b}
.A .ctx span{background:#f1e7dc;color:#6b4a3a}
.A h2{font-family:Fraunces,serif;font-weight:650;font-size:30px;line-height:1.15;letter-spacing:-.01em;padding:4px 26px 10px;max-width:640px}
.A .me{background:#2b2320;color:#fbf7f1;border-radius:18px 18px 4px 18px}
.A .ai .orb{background:radial-gradient(circle at 30% 30%,#f2b48f,#c2562f)}
.A .card{background:#fff;border:1px solid #eadfd3;border-radius:20px;box-shadow:0 10px 24px -18px #6b4a3a55}
.A .pic{background:#f6ebe0}.A .pic.two{background:#eef0e6}.A .pic.three{background:#ece7f1}
.A .badge{background:#2b2320;color:#fbf7f1}.A .badge.soft{background:#fff;color:#6b4a3a}
.A .brand{color:#a8603f}.A .name{font-family:Fraunces,serif;font-weight:650;font-size:18px}
.A .fit span{background:#f5efe7;color:#5a4a42}.A .fit span.ok{background:#e7f1ea;color:#2f6b45}
.A .price b{font-family:Fraunces,serif}.A .price small,.A .meta{color:#8a7b72}
.A .why{color:#c2562f}
.A .actions button{border:1px solid #e3d6c9;background:#fff;color:#2b2320}
.A .actions button.go{background:#c2562f;border-color:#c2562f;color:#fff}
.A .disclosure{color:#9a8b82}
.A .cmpbar{background:#2b2320;color:#fbf7f1;border-radius:14px}.A .cmpbar button{background:#f2b48f;color:#2b2320}
.A .box{background:#fff;border:1px solid #eadfd3;border-radius:20px;box-shadow:0 12px 30px -24px #6b4a3a88}
.A .box .ph{color:#a2958c}.A .chips span{background:#f5efe7;color:#6b4a3a}
.A .send button{background:#c2562f;color:#fff}

/* ---------- B: Soft Aurora ---------- */
.B .app{background:radial-gradient(60% 50% at 10% 0%,#ffd9c7 0%,transparent 60%),radial-gradient(50% 45% at 95% 10%,#dcd5ff 0%,transparent 60%),radial-gradient(60% 50% at 50% 100%,#cff3e6 0%,transparent 65%),#f7f6fb;color:#1f1b2e;font-family:"Plus Jakarta Sans","Be Vietnam Pro",sans-serif}
.B .logo i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,#ff9f7a,#b59cff,#6fd7b5,#ff9f7a);display:inline-block}
.B .status{background:#ffffffa8;backdrop-filter:blur(12px);padding:7px 12px;border-radius:999px;border:1px solid #fff}.B .status i{background:linear-gradient(135deg,#6fd7b5,#7a8cff)}
.B .ctx span{background:#ffffff9c;backdrop-filter:blur(10px);border:1px solid #ffffffd0;color:#4a4468}
.B h2{font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.15;padding:4px 26px 10px;max-width:640px;background:linear-gradient(90deg,#1f1b2e,#5b4bb7);-webkit-background-clip:text;background-clip:text;color:transparent}
.B .me{background:#1f1b2e;color:#fff;border-radius:20px 20px 6px 20px}
.B .ai .orb{background:conic-gradient(from 200deg,#ff9f7a,#b59cff,#6fd7b5,#ff9f7a);box-shadow:0 0 0 4px #ffffff80}
.B .card{background:#ffffffb8;backdrop-filter:blur(18px);border:1px solid #ffffffe6;border-radius:24px;box-shadow:0 20px 40px -28px #4b3fa066}
.B .pic{background:linear-gradient(135deg,#ffe6da,#f3e9ff);margin:8px;border-radius:18px}.B .pic.two{background:linear-gradient(135deg,#e2f7ef,#e8ecff)}.B .pic.three{background:linear-gradient(135deg,#fff3d6,#ffe3ea)}
.B .badge{background:#1f1b2e;color:#fff}.B .badge.soft{background:#ffffffd9;color:#4a4468}
.B .brand{color:#7a6fb0}
.B .fit span{background:#f1effa;color:#4a4468}.B .fit span.ok{background:#dff6ee;color:#1f7a5a}
.B .price small,.B .meta{color:#7c7896}
.B .why{color:#5b4bb7}
.B .actions button{border:1px solid #e6e3f3;background:#fff;color:#1f1b2e;border-radius:14px}
.B .actions button.go{background:linear-gradient(135deg,#7a5cff,#5b4bb7);border:0;color:#fff;box-shadow:0 8px 18px -8px #5b4bb7}
.B .disclosure{color:#8a86a3}
.B .cmpbar{background:#1f1b2ee8;backdrop-filter:blur(10px);color:#fff;border-radius:18px}.B .cmpbar button{background:#fff;color:#1f1b2e}
.B .box{background:#ffffffc4;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:24px;box-shadow:0 20px 50px -30px #4b3fa088}
.B .box .ph{color:#8a86a3}.B .chips span{background:#f1effa;color:#4a4468}
.B .send button{background:linear-gradient(135deg,#7a5cff,#5b4bb7);color:#fff}

/* ---------- C: Playful Bento ---------- */
.C .app{background:#fffdf7;color:#161616;font-family:"Plus Jakarta Sans","Be Vietnam Pro",sans-serif}
.C .logo i{width:32px;height:32px;border-radius:11px;background:#ffd84d;border:2px solid #161616;display:grid;place-items:center;font-style:normal;font-weight:800}
.C .status{border:2px solid #161616;padding:6px 11px;border-radius:999px;background:#c9f2d4}.C .status i{background:#161616}
.C .ctx span{border:2px solid #161616;background:#fff}
.C .ctx span:nth-child(2){background:#ffe1ec}.C .ctx span:nth-child(3){background:#dff0ff}
.C h2{font-weight:800;font-size:32px;letter-spacing:-.035em;line-height:1.1;padding:4px 26px 10px;max-width:640px}
.C h2 mark{background:#ffd84d;padding:0 6px;border-radius:8px}
.C .me{background:#161616;color:#fff;border-radius:22px 22px 6px 22px}
.C .ai .orb{background:#ff8fb1;border:2px solid #161616}
.C .card{background:#fff;border:2px solid #161616;border-radius:26px;box-shadow:5px 5px 0 #161616}
.C .pic{background:#ffe1ec;border-bottom:2px solid #161616}.C .pic.two{background:#dff0ff}.C .pic.three{background:#e6f7c8}
.C .badge{background:#ffd84d;color:#161616;border:2px solid #161616}.C .badge.soft{background:#fff}
.C .brand{color:#6b6b6b}
.C .fit span{border:1.5px solid #161616;background:#fff}.C .fit span.ok{background:#c9f2d4}
.C .price b{font-size:23px}.C .price small,.C .meta{color:#555}
.C .why{color:#161616;text-decoration:underline;text-underline-offset:3px}
.C .actions button{border:2px solid #161616;background:#fff;color:#161616;border-radius:14px}
.C .actions button.go{background:#ffd84d}
.C .disclosure{color:#666}
.C .cmpbar{background:#dff0ff;border:2px solid #161616;border-radius:18px;box-shadow:4px 4px 0 #161616}.C .cmpbar button{background:#161616;color:#fff}
.C .box{background:#fff;border:2px solid #161616;border-radius:24px;box-shadow:5px 5px 0 #161616}
.C .box .ph{color:#777}.C .chips span{border:1.5px solid #161616;background:#fffdf7}
.C .send button{background:#ff8fb1;border:2px solid #161616;color:#161616}
</style>
</head>
<body>
<div class="switch">
  <h1>Family AI — chọn hướng giao diện</h1>
  <button data-d="A" aria-pressed="true">A · Warm Editorial</button>
  <button data-d="B" aria-pressed="false">B · Soft Aurora</button>
  <button data-d="C" aria-pressed="false">C · Playful Bento</button>
</div>
<p class="note" id="note"></p>
<div class="stage">
  <div><p class="label">Desktop</p><div class="frame" id="desk"></div></div>
  <div><p class="label">Điện thoại</p><div class="frame phone" id="mob"></div></div>
</div>

<template id="screen">
  <div class="app">
    <div class="top">
      <div class="logo"><i>f</i> Family AI</div>
      <div class="status"><i></i> AI đang hỗ trợ</div>
    </div>
    <div class="ctx"><span>Bé Gold · 12 kg · size L</span><span>Ngân sách ≤ 380k</span><span class="hide-sm">Ưu tiên dùng đêm</span></div>
    <h2 class="hide-sm">Chọn bỉm đêm cho Gold, không phải lướt 50 tab.</h2>
    <div class="thread">
      <div class="me">Bé nhà mình giờ 12kg rồi, cần bỉm quần dùng đêm, tối đa 380k</div>
      <div class="ai"><span class="orb"></span><p>Mình tìm được 5 sản phẩm hợp 12 kg và dưới 380.000đ. Đây là 3 lựa chọn nên xem trước — loại đầu có điểm dùng đêm cao nhất trong catalog.</p></div>
      <div class="cards">
        <article class="card">
          <div class="pic"><span class="badge">Phù hợp nhất</span>__SVG__</div>
          <div class="body">
            <span class="brand">Nhãn A</span><span class="name">Dòng Đêm L44</span>
            <div class="fit"><span class="ok">✓ 12 kg (9–14)</span><span class="ok">✓ Đêm 4/5</span><span>Size L</span></div>
            <div class="price"><b>315.000đ</b><small>7.159đ/miếng</small></div>
            <span class="meta">Cửa hàng thử 1 · giá cập nhật 23:30 · chưa gồm phí giao</span>
            <span class="why">Vì sao gợi ý này? ›</span>
            <div class="actions"><button>So sánh</button><button class="go">Xem nơi bán ↗</button></div>
          </div>
        </article>
        <article class="card">
          <div class="pic two"><span class="badge soft">Lựa chọn 2</span>__SVG__</div>
          <div class="body">
            <span class="brand">Nhãn B</span><span class="name">Dòng Mỏng L60</span>
            <div class="fit"><span class="ok">✓ 12 kg</span><span>Đêm 3/5</span><span>Mềm 5/5</span></div>
            <div class="price"><b>349.000đ</b><small>5.817đ/miếng</small></div>
            <span class="meta">Cửa hàng thử 1 · giá cập nhật 23:30 · chưa gồm phí giao</span>
            <span class="why">Vì sao gợi ý này? ›</span>
            <div class="actions"><button>So sánh</button><button class="go">Xem nơi bán ↗</button></div>
          </div>
        </article>
        <article class="card">
          <div class="pic three"><span class="badge soft">Tiết kiệm</span>__SVG__</div>
          <div class="body">
            <span class="brand">Nhãn C</span><span class="name">Dòng Tiết Kiệm L72</span>
            <div class="fit"><span class="ok">✓ 12 kg</span><span>Chưa có dữ liệu đêm</span></div>
            <div class="price"><b>329.000đ</b><small>4.569đ/miếng</small></div>
            <span class="meta">Cửa hàng thử 2 · giá cập nhật 23:30 · chưa gồm phí giao</span>
            <span class="why">Vì sao gợi ý này? ›</span>
            <div class="actions"><button>So sánh</button><button class="go">Xem nơi bán ↗</button></div>
          </div>
        </article>
      </div>
      <p class="disclosure">Family AI có thể nhận hoa hồng khi bạn mua qua một số liên kết. Điều này không ảnh hưởng thứ tự đề xuất.</p>
    </div>
    <div class="cmpbar"><span>Đã chọn 2 sản phẩm để so sánh</span><button>So sánh ↗</button></div>
    <div class="composer"><div class="box">
      <span class="ph">Hỏi tiếp, ví dụ “loại nào thấm tốt hơn?”</span>
      <div class="send"><div class="chips"><span>So sánh 2 loại đầu</span><span class="hide-sm">Rẻ hơn nữa</span><span>Đổi ngân sách</span></div><button>↑</button></div>
    </div></div>
  </div>
</template>

<script>
const svg = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 30c0-5 4-9 9-9h54c5 0 9 4 9 9v8c0 22-14 41-36 41S14 60 14 38z" fill="#fff" stroke="currentColor" stroke-width="3" stroke-opacity=".35"/><path d="M14 36h72" stroke="currentColor" stroke-width="3" stroke-opacity=".25"/><circle cx="38" cy="54" r="4" fill="currentColor" opacity=".25"/><circle cx="62" cy="54" r="4" fill="currentColor" opacity=".25"/></svg>';
const notes = {
  A: "Warm Editorial — nền kem, cam đất, tiêu đề chữ có chân (serif). Cảm giác cao cấp, tin cậy như tạp chí/brand mẹ & bé premium. Hợp với định vị “người tư vấn hiểu nhà mình”.",
  B: "Soft Aurora — nền gradient pastel (đào, oải hương, bạc hà), panel kính mờ, nút gradient. Cảm giác sản phẩm AI hiện đại, êm dịu, giống thế hệ app AI 2025–2026.",
  C: "Playful Bento — khối màu pastel đậm, viền đen dày, bóng đổ cứng, bo góc lớn. Trẻ trung, nổi bật, dễ nhớ; hợp phụ huynh trẻ, mạng xã hội.",
};
const tpl = document.getElementById("screen").innerHTML.replaceAll("__SVG__", svg);
function show(d) {
  for (const id of ["desk", "mob"]) { const el = document.getElementById(id); el.className = "frame " + (id === "mob" ? "phone " : "") + d; el.innerHTML = tpl; }
  document.getElementById("note").textContent = notes[d];
  document.querySelectorAll(".switch button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.d === d)));
}
document.querySelectorAll(".switch button").forEach((b) => b.addEventListener("click", () => show(b.dataset.d)));
show("A");
</script>
</body>
</html>
