<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Thêm nhanh thu gọn</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#1f1a3d;--muted:#7a7497;--line:#e6e2f3;--primary:#6c55f0}
body{margin:0;background:#f6f4fd;font:14px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--ink);padding:24px 16px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
h2{font-size:13px;color:var(--muted);margin:10px 0 0;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.orb{width:30px;height:30px;border-radius:50%;background:conic-gradient(#a78bfa,#5eead4,#fca5a5,#a78bfa);flex:none}
.btn{border:0;border-radius:999px;padding:10px 18px;font:600 14px inherit;cursor:pointer;background:linear-gradient(135deg,#7b61ff,#5b45d6);color:#fff;box-shadow:0 6px 16px #6c55f033}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.link{background:none;border:0;color:var(--primary);font:600 13px inherit;cursor:pointer;padding:0}
/* Collapsed: one pill button */
.qa-toggle{display:inline-flex;align-items:center;gap:10px;border:1.5px solid #dcd5ff;background:linear-gradient(180deg,#fbfaff,#fff);border-radius:999px;padding:6px 16px 6px 6px;font:600 14px inherit;color:var(--ink);cursor:pointer}
.qa-toggle .orb{width:26px;height:26px}
.qa-toggle small{color:var(--muted);font-weight:500}
.qa-toggle:hover{border-color:#b9adff;box-shadow:0 0 0 3px #ece8ff}
/* Expanded */
.quick{border:1.5px solid #dcd5ff;background:linear-gradient(180deg,#fbfaff,#fff);display:grid;gap:12px}
.head{display:flex;gap:12px;align-items:flex-start}.head>div{flex:1}.head small{display:block;color:var(--muted);font-size:12.5px}
textarea{width:100%;box-sizing:border-box;min-height:112px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:14px/1.6 inherit;resize:vertical}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar .left{display:flex;align-items:center;gap:10px}.bar small{color:var(--muted);font-size:12px}
.filters{height:88px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style></head><body><div class="wrap">
<h2>Mặc định: chỉ một nút (bấm để thử)</h2>
<div id="slot"></div>
<div class="card filters">… bộ lọc sổ và bảng giao dịch ngay bên dưới …</div>
</div>
<script>
const slot = document.getElementById("slot");
function collapsed(){ slot.innerHTML = `<button class="qa-toggle" onclick="expanded()"><span class="orb"></span>Thêm nhanh bằng Trợ lý <small>· dán danh sách hoặc gửi ảnh</small></button>`; }
function expanded(){ slot.innerHTML = `<section class="card quick"><div class="head"><span class="orb"></span><div><b>Thêm nhanh bằng Trợ lý</b><small>Dán danh sách hoặc gửi ảnh, mỗi khoản một dòng hoặc cách nhau bằng dấu phẩy. Viết tắt cũng được (35k, 2tr5, t9).</small></div><button class="link" onclick="collapsed()">Thu gọn</button></div>
<textarea autofocus placeholder="12/9 ăn sáng 35k, cf 45k, đổ xăng 80k&#10;13/9 bỉm shopee 329k&#10;15/9 lương t9 25tr"></textarea>
<div class="bar"><div class="left"><button class="btn ghost">Gửi ảnh</button><small>Sao kê · ảnh chụp app ngân hàng · hóa đơn · sổ tay</small></div><button class="btn">Phân loại giúp tôi</button></div></section>`; slot.querySelector("textarea").focus(); }
collapsed();
</script></body></html>
